<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>Todo Application</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            min-height:100vh;

            font-family:'Poppins',sans-serif;

            background:
            linear-gradient(
                rgba(255,255,255,0.35),
                rgba(255,255,255,0.45)
            ),
            url('/Media/background.png');

            background-size:cover;
            background-position:center;
            background-repeat:no-repeat;
            background-attachment:fixed;

            color:#1f2937;
        }

        /* MAIN CONTAINER */

        .main-container{
            width:70%;

            min-height:100vh;

            margin:0 auto;

            padding:50px;
        }

        /* HEADER */

        .header-section{
            margin-bottom:50px;
        }

        .todo-title{
            font-size:5rem;

            font-weight:900;

            letter-spacing:4px;

            color:#111827;

            margin-bottom:12px;
        }

        .todo-subtitle{
            font-size:1.1rem;

            color:#475569;
        }

        /* INPUT SECTION */

        .input-wrapper{
            display:flex;

            gap:20px;

            background:rgba(173,136,61,0.35);

            border:2px solid rgba(255,255,255,0.25);

            padding:8px;

            border-radius:18px;

            backdrop-filter:blur(6px);

            box-shadow:
            0 10px 30px rgba(0,0,0,0.10);
        }

        .form-control{
            flex:1;

            border:none !important;

            background:transparent !important;

            color:#111827 !important;

            font-size:1.08rem;

            font-weight:500;

            padding-left:10px;
        }

        .form-control::placeholder{
            color:#141413;
        }

        .form-control:focus{
            box-shadow:none !important;
        }

        /* ADD BUTTON */

        .add-btn{
            border:none;

            padding:14px 30px;

            border-radius:16px;

            background:#111827;

            color:white;

            font-weight:600;

            transition:0.3s;
        }

        .add-btn:hover{
            background:black;

            transform:translateY(-2px);

            box-shadow:
            0 10px 20px rgba(0,0,0,0.15);
        }

        /* TASK LIST */

        .task-list{
            display:flex;

            flex-direction:column;

            gap:22px;

            margin-top:30px;
        }

        /* TASK CARD */

        .task-card{
            display:flex;

            justify-content:space-between;

            align-items:center;

            padding:24px 28px;

            border-radius:24px;

            background:rgba(255,255,255,0.32);

            border:2px solid rgba(255,255,255,0.25);

            backdrop-filter:blur(7px);

            box-shadow:
            0 10px 25px rgba(0,0,0,0.10);

            transition:0.3s;
        }

        .task-card:hover{
            transform:translateY(-5px);

            box-shadow:
            0 15px 35px rgba(0,0,0,0.12);
        }

        .task-title{
            font-size:1.12rem;

            font-weight:600;

            color:#0f172a;

            word-break:break-word;
        }

        .completed{
            text-decoration:line-through;

            opacity:0.45;
        }

        /* BUTTONS */

        .action-buttons{
            display:flex;

            gap:14px;
        }

        .toggle-btn,
        .delete-btn{
            border:none !important;

            padding:10px 18px;

            border-radius:14px;

            font-weight:600;

            transition:0.3s;
        }

        /* TOGGLE BUTTON */

        .toggle-btn{
            background:#dbeafe !important;

            color:#2563eb !important;
        }

        .toggle-btn:hover{
            background:#2563eb !important;

            color:white !important;
        }

        /* DELETE BUTTON */

        .delete-btn{
            background:#fee2e2 !important;

            color:#dc2626 !important;
        }

        .delete-btn:hover{
            background:#ef4444 !important;

            color:white !important;
        }

        /* MOBILE */

        @media(max-width:768px){

            .main-container{
                width:100%;

                padding:35px 20px;
            }

            .todo-title{
                font-size:3rem;
            }

            .input-wrapper{
                flex-direction:column;
            }

            .add-btn{
                width:100%;
            }

            .task-card{
                flex-direction:column;

                align-items:flex-start;

                gap:18px;
            }

            .action-buttons{
                width:100%;
            }

            .toggle-btn,
            .delete-btn{
                width:100%;
            }
        }

    </style>

</head>

<body>

<div class="main-container">

    <!-- HEADER -->

    <div class="header-section">

        <h1 class="todo-title">
            TODO
        </h1>

        <p class="todo-subtitle">
            Plan your day. Stay focused. Get things done.
        </p>

    </div>

    <!-- FORM -->

    <form th:action="@{/}" method="post">

        <div class="input-wrapper">

            <input
                    type="text"
                    name="title"
                    class="form-control"
                    placeholder="Write your next task..."
                    required>

            <button type="submit" class="add-btn">
                + Add Task
            </button>

        </div>

    </form>

    <!-- TASK LIST -->

    <div class="task-list"
         th:if="${tasks != null and !tasks.isEmpty()}">

        <th:block th:each="task : ${tasks}">

            <div class="task-card">

                <span
                        class="task-title"
                        th:classappend="${task.completed} ? 'completed' : ''"
                        th:text="${task.title}">
                </span>

                <div class="action-buttons">

                    <a
                        th:href="@{/{id}/toggle(id=${task.id})}"
                        class="btn toggle-btn">

                        Toggle

                    </a>

                    <a
                        th:href="@{/{id}/delete(id=${task.id})}"
                        class="btn delete-btn">

                        Delete

                    </a>

                </div>

            </div>

        </th:block>

    </div>

</div>

</body>

</html>
